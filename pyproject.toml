[project]
name = "server"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "eldar-kip", email = "odzha.eldar.i.3.24@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "fastapi[standard]>=0.141.1",
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "passlib[bcrypt]>=1.7.4",
    "pgvector>=0.5.0",
    "pwdlib[argon2]>=0.3.1",
    "pyjwt>=2.15.1",
    "pytest-asyncio>=1.4.0",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0.54",
]
[tool.fastapi]
entrypoint = "src.server.main:app"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
